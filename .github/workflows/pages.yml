name: Deploy to GitHub Pages

# 备份镜像：*.workers.dev 被 DNS 投毒 + SNI 阻断，无法直连。
# *.github.io 能直连但极慢（实测 30s 才 200），只作备份；
# 无代理首选入口是 Cloudflare Pages（*.pages.dev，SNI 未被拦）。
# 主部署仍是 Cloudflare Workers Builds，本工作流只做镜像，不改变线上主入口。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署，新的排队覆盖旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
